################
### MONITORS ###
################
# archmac: laptop eDP-1 always present; HDMI-A-1 for external monitor
# Uncomment and adjust the HDMI line when you connect a display.
monitor=eDP-1,preferred,0x0,1
# monitor=HDMI-A-1,preferred,1920x0,1
monitor=,preferred,auto,1

####################
### WORKSPACES   ###
####################
# Laptop screen — workspaces 1-9
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1

# Uncomment when using external monitor (HDMI-A-1)
# workspace = 11, monitor:HDMI-A-1, default:true
# workspace = 12, monitor:HDMI-A-1
# workspace = 13, monitor:HDMI-A-1
# workspace = 14, monitor:HDMI-A-1

#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = systemd-cat -t waybar waybar
exec-once = udiskie --tray
exec-once = wl-paste --watch cliphist store
exec-once = dunst
exec-once = hypridle

# Wallpaper
exec-once = awww-daemon &>/dev/null
exec-once = sleep 2 && ~/.config/hypr/wallpaper.sh

# Cursor
exec-once = hyprctl setcursor Breeze 24

# Fix Brave crash recovery (no-op until Brave is installed)
exec-once = ~/.config/hypr/fix-brave.sh

# Initial workspace apps
exec-once = sleep 3 && hyprctl dispatch -- exec "[workspace 1 silent] kitty"

#############################
### ENVIRONMENT VARIABLES ###
#############################
# archmac: dual AMD — card2 is the Vega iGPU driving the display
env = WLR_DRM_DEVICES,/dev/dri/card2
env = LIBVA_DRIVER_NAME,radeonsi
env = XCURSOR_THEME,Breeze
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 10
    gaps_out = 40
    border_size = 3
    col.active_border = rgba(EF3946ff)
    col.inactive_border = rgba(00000000)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.8
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 25
        render_power = 3
        color = rgba(EF3946ff)
        color_inactive = rgba(00000000)
    }

    blur {
        enabled = true
        size = 1
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = winIn, 0.1, 1.0, 0.1, 1.0
    bezier = smoothOut, 0.5, 0, 0.99, 0.99
    bezier = layerOut, 0.23, 1, 0.32, 1
    animation = windows, 1, 7, winIn, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = windowsMove, 1, 7, winIn, slide
    animation = workspaces, 1, 8, winIn, slide
    animation = workspacesOut, 1, 8, winIn, slide
    animation = layers, 1, 10, winIn, slide
    animation = layersOut, 1, 3, layerOut, popin 50%
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    accel_profile = flat
    follow_mouse = 1
    sensitivity = 0.8
    repeat_rate = 50
    repeat_delay = 200
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

###################
### KEYBINDINGS ###
###################

bind = SUPER, Return, exec, kitty
bind = SUPER, K, exec, kitty
bind = SUPER, D, exec, rofi -show drun -theme cyberpunk-popup -theme-str 'listview { lines: 16; }'
bind = SUPER, B, exec, brave
bind = SUPER, F, exec, firefox
bind = SUPER, T, exec, thunar
bind = SUPER, L, exec, deluge
bind = SUPER, G, exec, Telegram
bind = SUPER, C, exec, code
bind = SUPER, M, exec, kitty --class floating-cava -e cava

# Clipboard
bind = SUPER, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Window Management
bind = SUPER, Q, killactive
bind = SUPER SHIFT, Q, exit
bind = SUPER SHIFT, F, fullscreen
bind = SUPER, Space, togglefloating
bind = SUPER SHIFT, T, layoutmsg, togglesplit
bind = SUPER, W, exec, killall waybar || systemd-cat -t waybar waybar

# Focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Move Windows
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Resize Windows
bind = SUPER CTRL, left, resizeactive, -40 0
bind = SUPER CTRL, right, resizeactive, 40 0
bind = SUPER CTRL, up, resizeactive, 0 -40
bind = SUPER CTRL, down, resizeactive, 0 40

# Alt+Tab
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev

# Monitor focus (useful when HDMI is connected)
bind = SUPER, P, focusmonitor, +1
bind = SUPER SHIFT, P, movewindow, mon:+1

# Workspace Navigation
bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Workspaces 1-9 (laptop screen)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Move to Workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Screenshots
bind = , Print, exec, hyprshot -m region --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m output --clipboard-only
bind = CTRL, Print, exec, hyprshot -m window --clipboard-only
bind = ALT, Print, exec, sleep 3 && hyprshot -m output --clipboard-only

# System
bind = SUPER, Escape, exec, hyprlock
bind = SUPER, Delete, exec, ~/.config/rofi/powermenu.sh

# Media Keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness (AMD — brightnessctl)
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

##############################
### WINDOW RULES           ###
##############################

windowrule = match:class ^(floating-cava)$, float on
windowrule = match:class ^(floating-cava)$, size 800 400
windowrule = match:class ^(floating-cava)$, center on

windowrule = workspace 2, match:class ^(Code)$
windowrule = workspace 3, match:class ^(telegram|Telegram)$
